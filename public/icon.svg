<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Phone Body -->
  <rect x="136" y="56" width="240" height="400" rx="40" fill="url(#phoneGrad)" stroke="#38bdf8" stroke-width="8" />

  <!-- Screen Screen Inset -->
  <rect x="152" y="88" width="208" height="336" rx="24" fill="#030712" />

  <!-- Dynamic Island / Speaker Notch -->
  <rect x="216" y="70" width="80" height="10" rx="5" fill="#334155" />

  <!-- Bottom Home Bar Indicator -->
  <rect x="216" y="406" width="80" height="4" rx="2" fill="#64748b" />

  <!-- Diagnostic Pulse Waveform -->
  <path d="M 168 256 L 210 256 L 226 210 L 250 310 L 274 190 L 294 280 L 310 256 L 344 256"
        fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Success Check Badge -->
  <circle cx="340" cy="140" r="32" fill="#10b981" stroke="#090d16" stroke-width="6" filter="url(#glow)" />
  <path d="M 326 140 L 336 150 L 356 130" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
